# Configuración de Jenkins como código. Cada valor ${...} se lee de una variable de entorno
# que pasa docker-compose, así ningún token queda escrito en este archivo.
jenkins:
  systemMessage: "Pipeline de calidad: Maven + JUnit + SonarQube + Slack"
  numExecutors: 2
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_USER:-admin}"
          password: "${JENKINS_ADMIN_PASSWORD:-admin}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

credentials:
  system:
    domainCredentials:
      - credentials:
          - string:
              scope: GLOBAL
              id: "sonar-token"
              description: "Token de análisis de SonarQube"
              secret: "${SONAR_TOKEN:-sin-token}"
          - string:
              scope: GLOBAL
              id: "slack-token"
              description: "Bot User OAuth Token de la app de Slack"
              secret: "${SLACK_TOKEN:-sin-token}"

tool:
  jdk:
    installations:
      - name: "jdk21"
        home: "/opt/java/openjdk"
  maven:
    installations:
      - name: "maven2026A"
        home: "/opt/maven"
  sonarRunnerInstallation:
    installations:
      - name: "sonar-scanner"
        home: "/opt/sonar-scanner"

unclassified:
  location:
    url: "${JENKINS_PUBLIC_URL:-http://localhost:8080/}"
  sonarGlobalConfiguration:
    buildWrapperEnabled: true
    installations:
      - name: "sonarqube"
        serverUrl: "http://sonarqube:9000"
        credentialsId: "sonar-token"
  slackNotifier:
    teamDomain: "${SLACK_WORKSPACE:-}"
    tokenCredentialId: "slack-token"
    room: "${SLACK_CHANNEL:-#jenkins}"
    botUser: true

jobs:
  - file: /usr/share/jenkins/ref/casc/job-calidad.groovy
