# Entorno de aseguramiento de calidad: Jenkins orquesta, SonarQube analiza, PostgreSQL guarda los datos de SonarQube
# y ngrok expone Jenkins a internet para recibir los webhooks de GitHub.
services:
  jenkins:
    build: ./jenkins
    container_name: calidad-jenkins
    ports:
      - "8080:8080"
    environment:
      # Todos vienen de tu terminal o del script arrancar; ninguno se escribe en archivos.
      JENKINS_ADMIN_USER: ${JENKINS_ADMIN_USER:-admin}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:-admin}
      JENKINS_PUBLIC_URL: ${JENKINS_PUBLIC_URL:-http://localhost:8080/}
      SONAR_TOKEN: ${SONAR_TOKEN:-}
      SLACK_TOKEN: ${SLACK_TOKEN:-}
      SLACK_WORKSPACE: ${SLACK_WORKSPACE:-}
      SLACK_CHANNEL: ${SLACK_CHANNEL:-#jenkins}
      REPO_URL: ${REPO_URL:-https://github.com/AlfonsoDbn-314/simple-java-maven-app.git}
      REPO_BRANCH: ${REPO_BRANCH:-*/master}
      JOB_NAME_LAB: ${JOB_NAME_LAB:-0900216641_JavaMaven1A}
    volumes:
      - jenkins_home:/var/jenkins_home
    depends_on:
      - sonarqube
    networks:
      - calidad

  sonarqube:
    image: sonarqube:community
    container_name: calidad-sonarqube
    ports:
      - "9000:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    depends_on:
      - db
    networks:
      - calidad

  # ngrok publica Jenkins en una URL https para que GitHub pueda enviarle el webhook.
  # El token NO va en este archivo: se lee de la variable de entorno NGROK_AUTHTOKEN.
  ngrok:
    image: ngrok/ngrok:latest
    container_name: calidad-ngrok
    command: http jenkins:8080
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    ports:
      - "4040:4040"
    depends_on:
      - jenkins
    # Solo arranca si lo pides con --profile ngrok, así el resto funciona aunque no tengas token.
    profiles:
      - ngrok
    networks:
      - calidad

  db:
    image: postgres:16
    container_name: calidad-db
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    volumes:
      - postgresql_data:/var/lib/postgresql/data
    networks:
      - calidad

networks:
  calidad:

volumes:
  jenkins_home:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  postgresql_data:
